name: Review service tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  dotnet-test:
    name: .NET 8 and Python integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public PDF parser
        run: python -m pip install -r service-dotnet/engine/requirements.txt
      - name: Python engine tests
        run: python -m unittest discover -s service-dotnet/engine -v
      - name: xUnit HTTP, SQLite and subprocess tests
        run: dotnet test service-dotnet/Review.sln --configuration Release --disable-build-servers --logger 'trx;LogFileName=review.trx'
      - name: Verify distributable includes Python bridge
        run: |
          dotnet publish service-dotnet/Review.Api --configuration Release --no-restore --disable-build-servers --output "$RUNNER_TEMP/review-publish"
          test -f "$RUNNER_TEMP/review-publish/engine/review.py"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Postman collection
        run: |
          npm install --prefix "$RUNNER_TEMP/newman" newman@6.2.1
          export Review__DataDirectory="$RUNNER_TEMP/review-data"
          dotnet run --project service-dotnet/Review.Api --configuration Release --no-build --urls http://127.0.0.1:5080 > "$RUNNER_TEMP/api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; wait "$api_pid" 2>/dev/null || true' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:5080/health >/dev/null && break; sleep 1; done
          "$RUNNER_TEMP/newman/node_modules/.bin/newman" run service-dotnet/postman/readings.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: service-dotnet/Review.Api.Tests/TestResults/*.trx
